    <h1>Lista de Livros</h1>
    <ul id="lista-livros"></ul>

        fetch('http://127.0.0.1:8000/livros')

                    lista.innerHTML = '<li>Nenhum livro cadastrado ainda.</li>';
                    return;

                        `${livro.titulo} — ${livro.autor} (${livro.ano_publicacao}) — R$ ${livro.preco.toFixed(2)}`;
                    lista.appendChild(item);
                });
            })
            .catch(erro => console.error('Erro ao buscar livros:', erro));
    </script>
